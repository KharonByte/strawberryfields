name: Documentation check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: maintenance/requirements-*.txt
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          python -m pip install -r maintenance/requirements-docs.txt
          python -m pip check
      - name: Build the complete documentation with warnings as errors
        run: python maintenance/build_docs.py
      - name: Save HTML and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: |
            maintenance/artifacts/docs/html/
            maintenance/artifacts/docs/build.log
            maintenance/artifacts/docs/warnings.log
          retention-days: 14
