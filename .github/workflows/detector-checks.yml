name: Detector harness checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detector-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - name: Synthetic controls and adversarial CI tests (no detector sampling)
        run: |
          mkdir -p maintenance/artifacts/detector-harness
          python -B -m unittest discover -s maintenance/detector_validation/tests -v 2>&1 | tee maintenance/artifacts/detector-harness/tests.log
          python -B -m maintenance.detector_validation.workflow smoke --out maintenance/artifacts/detector-harness/smoke.json
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detector-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: maintenance/artifacts/detector-harness/
          retention-days: 30
          if-no-files-found: error
