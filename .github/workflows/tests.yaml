name: Tests
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PURE: '1'
  LOGGING: info
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  TF_NUM_INTRAOP_THREADS: '1'
  TF_NUM_INTEROP_THREADS: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'

jobs:
  matrix:
    name: upstream (${{ matrix.os }}, ${{ matrix.profile.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      SYMPY_USE_CACHE: "no"
      OPTIONS: ${{ matrix.profile.options }}
      BATCHED: ${{ matrix.profile.batched }}
      RESULTS: maintenance/artifacts/core/${{ matrix.os }}-${{ matrix.profile.id }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        profile:
          - {id: all-backends, batched: '0', options: '', tensorflow: true, cloud: true}
          - {id: tensorflow-batched-pure, batched: '1', options: 'tf and pure', tensorflow: true, cloud: true}
          - {id: tensorflow-batched-mixed, batched: '1', options: 'tf and mixed', tensorflow: true, cloud: true}
          - {id: non-tensorflow, batched: '0', options: 'not tf', tensorflow: false, cloud: true}
          - {id: local-without-cloud, batched: '0', options: 'not tf', tensorflow: false, cloud: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            maintenance/requirements-*.txt

      - name: Install the pinned core test environment
        run: python -m pip install -r maintenance/requirements-core.txt

      - name: Install the cloud extra for remote API tests
        if: matrix.profile.cloud
        run: python -m pip install -r maintenance/requirements-cloud.txt

      - name: Install TensorFlow for the configurations that use it
        if: matrix.profile.tensorflow
        run: python -m pip install -r maintenance/requirements-tensorflow.txt

      - name: Install and check the project
        env:
          EXPECT_TENSORFLOW: ${{ matrix.profile.tensorflow }}
          EXPECT_CLOUD: ${{ matrix.profile.cloud }}
        run: |
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          python - <<'PY'
          import importlib.util
          import os
          for module, setting in [('tensorflow', 'EXPECT_TENSORFLOW'), ('xcc', 'EXPECT_CLOUD')]:
              expected = os.environ[setting] == 'true'
              assert (importlib.util.find_spec(module) is not None) == expected, module
          PY

      - name: Run the full suite or explicit optional-dependency/batch configuration
        run: |
          mkdir -p "$RESULTS"
          python -m pytest tests -q --tb=short -p no:warnings \
            --randomly-seed=42 -m "$OPTIONS" \
            --cov=strawberryfields --cov-branch --cov-report=term \
            --cov-report="xml:$RESULTS/coverage.xml" \
            --junitxml="$RESULTS/tests.xml" 2>&1 | tee "$RESULTS/pytest.log"

      - name: Require the maintained backend checks to execute
        run: python maintenance/check_required_tests.py "$RESULTS/tests.xml" "${{ matrix.profile.id }}"

      - name: Save test results, coverage and failure details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-${{ matrix.os }}-${{ matrix.profile.id }}
          path: maintenance/artifacts/core/${{ matrix.os }}-${{ matrix.profile.id }}/
          retention-days: 14

  core-tests:
    if: always()
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      MATRIX_RESULT: ${{ needs.matrix.result }}
    steps:
      - name: Require every test configuration to pass
        run: |
          if [ "$MATRIX_RESULT" != success ]; then
            echo "::error::Upstream test matrix did not pass: $MATRIX_RESULT"
            exit 1
          fi
