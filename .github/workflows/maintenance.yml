name: Scoped maintenance checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  heterodyne:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check: heterodyne
          - os: windows-2025
            check: measurement-windows
          - os: macos-15
            check: measurement-macos
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: maintenance/requirements-python312.txt
      - name: Install the pinned test environment
        run: python -m pip install -r maintenance/requirements-python312.txt
      - name: Run the installed-package regression tests
        run: |
          python -m pip install wheel==0.48.0
          python -m pytest -q --tb=short --disable-warnings tests/apps/test_installed_data.py --junitxml=maintenance/artifacts/installed-package.xml
      - name: Run the scoped measurement tests
        run: >-
          python -m pytest -q --tb=short --disable-warnings
          -m "bosonic or gaussian"
          tests/bosonic_files
          tests/backend/test_heterodyne.py
          tests/backend/test_postselection.py
          tests/backend/test_threshold_measurement.py
          tests/integration/test_measurement_integration.py
          --junitxml=maintenance/artifacts/related.xml
      - name: Run the thermal-loss regression tests
        run: >-
          python -m pytest -q --tb=short --disable-warnings
          -m "bosonic or gaussian"
          tests/integration/test_ops_integration.py::TestChannelApplication::test_thermal_loss_does_not_heat_other_modes
          tests/integration/test_ops_integration.py::TestChannelApplication::test_thermal_loss_multimode_moments
          --junitxml=maintenance/artifacts/thermal-loss.xml
      - name: Run the Gaussian purity regression tests
        run: >-
          python -m pytest -q --tb=short --disable-warnings
          tests/backend/test_states.py::TestGaussianStatePurity
          --junitxml=maintenance/artifacts/gaussian-purity.xml
      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoped-validation-${{ runner.os }}
          path: maintenance/artifacts/
          retention-days: 14
