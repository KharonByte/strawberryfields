name: Scoped maintenance checks

on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heterodyne:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: maintenance/requirements-python312.txt
      - name: Install the pinned test environment
        run: python -m pip install -r maintenance/requirements-python312.txt
      - name: Reproduce the failure and validate the patch
        run: python maintenance/check.py --related
      - name: Save demo, test and environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heterodyne-validation
          path: maintenance/artifacts/
