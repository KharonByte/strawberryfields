name: Scoped maintenance checks

on:
  push:
    branches: [master, 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heterodyne:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: maintenance/requirements-python312.txt
      - name: Install the pinned test environment
        run: python -m pip install -r maintenance/requirements-python312.txt
      - name: Run the scoped measurement tests
        run: >-
          python -m pytest -q --tb=short --disable-warnings
          -m "bosonic or gaussian"
          tests/bosonic_files
          tests/backend/test_heterodyne.py
          tests/backend/test_postselection.py
          tests/backend/test_threshold_measurement.py
          tests/integration/test_measurement_integration.py
          --junitxml=maintenance/artifacts/related.xml
      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoped-validation
          path: maintenance/artifacts/
